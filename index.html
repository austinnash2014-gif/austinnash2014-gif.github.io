
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEHUB</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #10121a;
    color: white;
    font-family: Arial, sans-serif;
}
header {
    background: #191d2a;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #303548;
}
.logo { font-size: 25px; font-weight: bold; color: #70a5ff; }
main { padding: 35px 7%; }
h1 { font-size: 32px; }
#games {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(190px,1fr));
    gap: 20px;
}
.game {
    background: #1d2231;
    border: 1px solid #303548;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: .2s;
}
.game:hover { transform: translateY(-4px); border-color: #70a5ff; }
.thumbnail {
    height: 115px;
    background: #303c59;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 45px;
}
button {
    background: #568cff;
    color: white;
    border: 0;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
}
#player { display: none; }
#player iframe {
    width: 100%;
    height: 75vh;
    background: white;
    border: 0;
    border-radius: 8px;
}
</style>
</head>
<body>

<header>
    <div class="logo">GAMEHUB</div>
    <div>HTML GAME LIBRARY</div>
</header>

<main>
    <section id="menu">
        <h1>Game library</h1>
        <p>Choose a game to play.</p>
        <div id="games"></div>
    </section>

    <section id="player">
        <button onclick="back()">← Back</button>
        <h2 id="gameTitle"></h2>
        <iframe id="gameFrame"></iframe>
        <br><br>
        <button onclick="document.getElementById('gameFrame').requestFullscreen()">Fullscreen</button>
    </section>
</main>

<script>
const games = [
    {name: "Mario 64", file: "games/sm64.html"},
    {name: "GTA 1", file: "games/gta.html"},
    {name: "Super Mario Bros", file: "games/smb.html"}
];

const container = document.getElementById("games");

games.forEach(game => {
    const card = document.createElement("div");
    card.className = "game";
    card.innerHTML = `
        <div class="thumbnail">${game.icon}</div>
        <h3>${game.name}</h3>
        <button>PLAY</button>
    `;
    card.onclick = () => play(game);
    container.appendChild(card);
});

function play(game) {
    document.getElementById("menu").style.display = "none";
    document.getElementById("player").style.display = "block";
    document.getElementById("gameTitle").textContent = game.name;
    document.getElementById("gameFrame").src = game.file;
}

function back() {
    document.getElementById("gameFrame").src = "about:blank";
    document.getElementById("player").style.display = "none";
    document.getElementById("menu").style.display = "block";
}
</script>

</body>
</html>
